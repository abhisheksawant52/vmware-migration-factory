[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vmware-migration-factory"
version = "0.1.0"
description = "Discover, right-size, and track VMware vSphere workloads migrating to the cloud"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Abhishek Sawant" }]
keywords = ["vmware", "vsphere", "migration", "cloud", "assessment", "pyvmomi"]
dependencies = [
  "pyVmomi>=8.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "black>=24.0", "pre-commit>=3.7"]

[project.scripts]
vmf = "vmware_migration.cli:main"

[project.urls]
Homepage = "https://github.com/abhisheksawant52/vmware-migration-factory"
Issues = "https://github.com/abhisheksawant52/vmware-migration-factory/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
